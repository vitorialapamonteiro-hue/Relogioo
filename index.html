<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Relogio </title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="relogio">

  <img src="https://i.postimg.cc/G38CstLy/album-todas-paginas-em-branco-1-pdf-20261030-212510-0003.png" alt="Torre do relógio">

  <div class="mostrador">
    <div class="ponteiro segundo"></div>
  </div>

  <button class="sino" aria-label="Tocar o sino"></button>

  <div class="contador">
    <div class="linha-principal">
      <div>
        <strong id="anos">0</strong>
        <span>ANOS</span>
      </div>
      <div>
        <strong id="meses">0</strong>
        <span>MESES</span>
      </div>
      <div>
        <strong id="dias">0</strong>
        <span>DIAS</span>
      </div>
    </div>

    <div class="linha-tempo">
      <div><strong id="horas">00</strong></div>
      <div><strong id="minutos">00</strong></div>
      <div><strong id="segundos">00</strong></div>
    </div>
  </div>

</div>
    <script  src="./script.js"></script>

  </body>
  
</html>
